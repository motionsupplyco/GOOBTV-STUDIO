name: Build WRONGSIDE Pip GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_pip.py'
      - '.github/workflows/build-pip.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Build original 3D character
        run: blender -b -t 2 --python tools/build_pip.py
      - uses: actions/upload-artifact@v4
        with:
          name: WRONGSIDE-Pip-GLB
          path: assets/characters/pip.glb
          if-no-files-found: error
